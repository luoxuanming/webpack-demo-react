# .github/workflows/deploy.yml
name: Build and Deploy

on:
  push:
    branches:
      - main      # main 分支 push 时触发
  pull_request:
    branches:
      - main      # PR 到 main 时触发 CI 检查

jobs:
  # ─── CI：构建检查 ──────────────────────────
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci  # 比 npm install 更严格，用 lock 文件

      - name: 构建
        run: npm run build
        env:
          NODE_ENV: production

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1  # 只保留1天

  # ─── CD：部署到服务器 ──────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build          # 依赖 build job 成功
    if: github.ref == 'refs/heads/main'  # 只有 main 分支才部署

    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: 部署到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}      # 服务器 IP
          username: ${{ secrets.SERVER_USER }}  # 登录用户名
          key: ${{ secrets.SERVER_SSH_KEY }}    # SSH 私钥
          source: 'dist/*'
          target: '/var/www/webpack-demo'       # 服务器部署目录

      - name: 重启 nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo nginx -t && sudo systemctl reload nginx
            echo "✅ 部署完成"